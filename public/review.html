<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nota.Lawyer — Intake review</title>
<style>
  :root{--ink:#14213d;--muted:#5b6478;--accent:#0b7a75;--bg:#f6f7fb;--line:#dfe3ec}
  body{margin:0;font:15px/1.5 system-ui,sans-serif;color:var(--ink);background:var(--bg)}
  .wrap{max-width:980px;margin:0 auto;padding:28px 20px}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .brand{font-weight:700}.brand span{color:var(--accent)}
  input,button{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
  button{background:var(--accent);color:#fff;border-color:var(--accent);cursor:pointer}
  button.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:16px}
  .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
  .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:600;background:#eef}
  .pill.interviewed{background:#e6f4f1;color:#0b5a56}.pill.calling{background:#fff4e0;color:#8a5a00}.pill.failed,.pill.incomplete{background:#fbe9e7;color:#b3261e}
  dl{display:grid;grid-template-columns:180px 1fr;gap:4px 12px;margin:12px 0}dt{color:var(--muted)}dd{margin:0}
  details{margin-top:10px}pre{white-space:pre-wrap;background:#f3f4f8;padding:10px;border-radius:8px;font-size:.85rem}
  .turn{margin:2px 0}.turn b{color:var(--accent)}
  .rem{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .muted{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Nota<span>.</span>Lawyer — Intake review</div>
    <div><input id="tok" placeholder="review token" size="28"> <button id="load">Load</button> <button class="ghost" id="sync">Sync with CALL-E</button></div>
  </header>
  <div id="list"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const tok = $("#tok"); try { tok.value = localStorage.getItem("nota_tok") || ""; } catch {}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function load(sync) {
  try { localStorage.setItem("nota_tok", tok.value); } catch {}
  const r = await fetch(`/api/intakes?token=${encodeURIComponent(tok.value)}${sync?"&sync=1":""}`);
  if (!r.ok) { $("#list").innerHTML = `<div class="card">Error ${r.status}</div>`; return; }
  const { intakes } = await r.json();
  $("#list").innerHTML = intakes.length ? intakes.map(card).join("") : `<div class="card muted">No intakes yet.</div>`;
  document.querySelectorAll("[data-remind]").forEach(b => b.onclick = () => remind(b.dataset.remind));
}
function card(x) {
  const res = x.result || {};
  const rows = [["Name", res.full_name || x.form.name], ["Phone", `${x.form.phone} · ${x.form.region} · ${x.form.locale}`],
    ["Matter type", res.matter_type], ["Summary", res.matter_summary || x.form.matter], ["Opposing party (conflict check)", res.opposing_party],
    ["Urgency", res.urgency], ["Deadline / court date", res.deadline_or_court_date], ["Best time to call", res.best_time_to_call],
    ["Consent to contact", res.consent_to_contact], ["Confidence", x.confidence ? `${x.confidence.label} (${x.confidence.score})` : ""], ["Failure", x.failure]]
    .filter(([,v]) => v).map(([k,v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("");
  const turns = (x.transcript||[]).map(t => `<div class="turn"><b>${esc(t.speaker)}</b>: ${esc(t.text)}</div>`).join("");
  const rems = (x.reminders||[]).map(r => `<div class="muted">Reminder call ${esc(r.when)} — ${esc(r.status)} (${esc(r.call_id)})</div>`).join("");
  return `<div class="card"><div class="top"><div><span class="pill ${x.status}">${esc(x.status)}</span> &nbsp;<b>${esc(res.full_name || x.form.name)}</b></div>
    <div class="muted">${new Date(x.created_at).toLocaleString()} · ${esc(x.id)}</div></div>
    <dl>${rows}</dl>
    ${x.summary ? `<div><b>CALL-E summary:</b> ${esc(x.summary)}</div>` : ""}
    ${turns ? `<details><summary>Transcript</summary>${turns}</details>` : ""}
    <div class="rem"><input id="when_${x.id}" placeholder="e.g. Tuesday Sept 9 at 10:00 AM" size="34"> <button data-remind="${x.id}">Schedule reminder call</button></div>${rems}
  </div>`;
}
async function remind(id) {
  const when = document.getElementById("when_"+id).value.trim(); if (!when) return;
  const r = await fetch(`/api/remind?token=${encodeURIComponent(tok.value)}`, {method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({id, when})});
  const j = await r.json(); if (!r.ok) alert(j.message || j.error); load(false);
}
$("#load").onclick = () => load(false); $("#sync").onclick = () => load(true);
if (tok.value) load(false);
</script>
</body>
</html>
