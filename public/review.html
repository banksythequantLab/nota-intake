<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nota.Lawyer — Intake review</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#12213f;--ink2:#3b4863;--muted:#6b7590;--paper:#f7f3ec;--card:#fffdf9;--line:#e6dfd2;--brass:#b8862b;--teal:#0b7a75;--shadow:0 10px 30px rgba(18,33,63,.07)}
  *{box-sizing:border-box}body{margin:0;font:15px/1.5 Inter,system-ui,sans-serif;color:var(--ink);background:var(--paper)}
  .wrap{max-width:1040px;margin:0 auto;padding:22px 20px 60px}
  header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
  .brand{font:700 22px/1 Fraunces,serif}.brand span{color:var(--brass)}.brand small{font:500 14px Inter,sans-serif;color:var(--muted);margin-left:10px}
  input,button,select{font:inherit;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
  button{background:var(--teal);color:#fff;border-color:var(--teal);cursor:pointer;font-weight:600}
  button.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
  .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 0 6px}
  .chip{background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink2)}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .stats{color:var(--muted);font-size:13.5px;margin-left:auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 22px;margin-top:14px;box-shadow:var(--shadow)}
  .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
  .who{display:flex;align-items:center;gap:10px}.who b{font:700 20px Fraunces,serif}
  .type{display:inline-flex;align-items:center;gap:6px;background:#fff8e8;border:1px solid #efe0b8;color:#6b4e0d;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;background:#eef}
  .pill.interviewed{background:#e2f3ea;color:#1f6b45}.pill.calling{background:#fff1d6;color:#8a5a00}.pill.failed,.pill.incomplete{background:#fbe4e2;color:#a3261e}
  .meta{color:var(--muted);font-size:13px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 26px;margin:14px 0 4px}@media(max-width:640px){.grid{grid-template-columns:1fr}}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:2px 10px;padding:6px 0;border-bottom:1px solid #f0eae0}.kv dt{color:var(--muted);font-size:13px}.kv dd{margin:0;font-weight:500}
  .kv.hi dd{color:#7a2e0f;font-weight:700}
  .sec{font:700 12px Inter,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--brass);margin:14px 0 4px}
  details{margin-top:10px}summary{cursor:pointer;font-weight:600;color:var(--ink2)}
  .turn{margin:3px 0;padding:6px 10px;border-radius:8px;font-size:14px}.turn.bot{background:#f3f4f8}.turn.user{background:#e8f4f3}.turn b{color:var(--teal);margin-right:6px}
  .summary{background:#f8f5ee;border-left:3px solid var(--brass);padding:10px 12px;border-radius:0 10px 10px 0;margin-top:12px;font-size:14px}
  .rem{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}.rem input{flex:1;min-width:220px}
  .muted{color:var(--muted)}.empty{padding:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Nota<span>.</span>Lawyer <small>Intake review</small></div>
    <div><input id="tok" placeholder="review token" size="26"> <button id="load">Load</button> <button class="ghost" id="sync">Sync with CALL-E</button></div>
  </header>
  <div class="tools" id="tools"></div>
  <div id="list"></div>
</div>
<script>
const $ = s => document.querySelector(s);
const tok = $("#tok"); try { tok.value = localStorage.getItem("nota_tok") || ""; } catch {}
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nice = k => k.replace(/_/g, " ").replace(/^\w/, c => c.toUpperCase());
const BASE = ["full_name","email","preferred_language","matter_summary","other_parties","opposing_party","urgency","deadline_or_court_date","best_time_to_call","consent_to_contact"];
let MATTERS = {}, DATA = [], filter = "all";
fetch("/api/matters").then(r=>r.json()).then(j=>{ MATTERS=j.matters; renderTools(); draw(); }).catch(()=>{});
async function load(sync) {
  try { localStorage.setItem("nota_tok", tok.value); } catch {}
  const r = await fetch(`/api/intakes?token=${encodeURIComponent(tok.value)}${sync?"&sync=1":""}`);
  if (!r.ok) { $("#list").innerHTML = `<div class="card">Error ${r.status} — check the review token.</div>`; return; }
  DATA = (await r.json()).intakes; renderTools(); draw();
}
function renderTools() {
  const counts = {}; DATA.forEach(x => { const k = x.form.matter_type || "other"; counts[k] = (counts[k]||0)+1; });
  const chips = [["all","All"], ...Object.entries(MATTERS).map(([id,m]) => [id, `${m.icon} ${m.label.en}`])]
    .map(([id,l]) => `<span class="chip ${filter===id?"on":""}" data-f="${id}">${l}${id==="all"?` (${DATA.length})`:(counts[id]?` (${counts[id]})`:"")}</span>`).join("");
  $("#tools").innerHTML = chips + `<span class="stats">${DATA.filter(x=>x.status==="interviewed").length} interviewed · ${DATA.filter(x=>x.status==="calling").length} calling</span>`;
  document.querySelectorAll("[data-f]").forEach(c => c.onclick = () => { filter = c.dataset.f; renderTools(); draw(); });
}
function draw() {
  const rows = DATA.filter(x => filter==="all" || (x.form.matter_type||"other")===filter);
  $("#list").innerHTML = rows.length ? rows.map(card).join("") : `<div class="card empty">No intakes yet. Records appear here about a minute after a client submits the form.</div>`;
  document.querySelectorAll("[data-remind]").forEach(b => b.onclick = () => remind(b.dataset.remind));
}
function kv(k, v, hi) { return v ? `<div class="kv ${hi?"hi":""}"><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>` : ""; }
function card(x) {
  const res = x.result || {}; const mt = x.form.matter_type || "other"; const m = MATTERS[mt] || {icon:"💬",label:{en:"Other"},fields:[]};
  const typeFields = (m.fields||[]).filter(k => res[k] && !["none","unknown"].includes(String(res[k]).toLowerCase()));
  const base = [
    ["Name", res.full_name || x.form.name], ["Phone", `${x.form.phone} · ${x.form.region} · ${x.form.locale}`],
    ["Email", res.email && res.email !== "none" ? res.email : x.form.email], ["Summary", res.matter_summary || x.form.matter],
    ["Other parties (conflict check)", res.other_parties || res.opposing_party, true], ["Urgency", res.urgency],
    ["Deadline / court date", res.deadline_or_court_date], ["Best time to call", res.best_time_to_call], ["Consent to contact", res.consent_to_contact],
    ["Confidence", x.confidence ? `${x.confidence.label} (${x.confidence.score})` : ""], ["Failure", x.failure],
  ].map(([k,v,h]) => kv(k,v,h)).join("");
  const extra = typeFields.map(k => kv(nice(k), res[k])).join("");
  const turns = (x.transcript||[]).map(t => `<div class="turn ${t.speaker==="bot"?"bot":"user"}"><b>${t.speaker==="bot"?"Assistant":"Client"}</b>${esc(t.text)}</div>`).join("");
  const rems = (x.reminders||[]).map(r => `<div class="muted">Reminder call ${esc(r.when)} — ${esc(r.status)} (${esc(r.call_id)})</div>`).join("");
  return `<div class="card">
    <div class="top"><div class="who"><span class="pill ${x.status}">${esc(x.status)}</span><b>${esc(res.full_name || x.form.name)}</b><span class="type">${m.icon} ${esc(m.label.en)}</span></div>
      <div class="meta">${new Date(x.created_at).toLocaleString()} · ${esc(x.id)}</div></div>
    <div class="grid"><div>${base}</div><div>${extra ? `<div class="sec">${esc(m.label.en)} details</div>${extra}` : `<div class="sec">Matter details</div><div class="muted" style="padding:6px 0">No type-specific fields captured${x.status==="calling"?" yet":""}.</div>`}</div></div>
    ${x.summary ? `<div class="summary"><b>CALL-E summary:</b> ${esc(x.summary)}</div>` : ""}
    ${turns ? `<details><summary>Transcript (${(x.transcript||[]).length} turns)</summary>${turns}</details>` : ""}
    <div class="rem"><input id="when_${x.id}" placeholder="Consultation date & time, e.g. Tuesday Sept 9 at 10:00 AM"><button data-remind="${x.id}">Schedule reminder call</button></div>${rems}
  </div>`;
}
async function remind(id) {
  const when = document.getElementById("when_"+id).value.trim(); if (!when) return;
  const r = await fetch(`/api/remind?token=${encodeURIComponent(tok.value)}`, {method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({id, when})});
  const j = await r.json(); if (!r.ok) { const el = document.getElementById("when_"+id); el.value = (j.message || j.error); } load(false);
}
$("#load").onclick = () => load(false); $("#sync").onclick = () => load(true);
if (tok.value) load(false);
</script>
</body>
</html>
