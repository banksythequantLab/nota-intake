<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nota.Lawyer — Request a consultation</title>
<style>
  :root{--ink:#14213d;--muted:#5b6478;--accent:#0b7a75;--bg:#f6f7fb;--card:#fff;--line:#dfe3ec;--err:#b3261e}
  *{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
  .wrap{max-width:560px;margin:0 auto;padding:32px 20px}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
  .brand{font-weight:700;letter-spacing:.3px}.brand span{color:var(--accent)}
  .lang button{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit;color:var(--muted)}
  .lang button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px}
  h1{font-size:1.5rem;margin:0 0 6px}p.lead{margin:0 0 22px;color:var(--muted)}
  label{display:block;font-weight:600;margin:16px 0 6px}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font:inherit}
  textarea{min-height:84px;resize:vertical}
  .row{display:grid;grid-template-columns:150px 1fr;gap:10px}
  .hint{color:var(--muted);font-size:.9rem;margin-top:6px}
  .consent{display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-size:.95rem}
  .consent input{width:auto;margin-top:4px}
  button.go{margin-top:22px;width:100%;padding:14px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer}
  button.go[disabled]{opacity:.6;cursor:wait}
  .msg{margin-top:16px;padding:14px;border-radius:10px;display:none}
  .msg.ok{display:block;background:#e6f4f1;color:#0b5a56}.msg.err{display:block;background:#fbe9e7;color:var(--err)}
  footer{margin-top:18px;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Nota<span>.</span>Lawyer</div>
    <div class="lang"><button data-l="en" class="on">English</button> <button data-l="es">Español</button> <button data-l="id">Bahasa</button></div>
  </header>
  <div class="card">
    <h1 data-i="title"></h1>
    <p class="lead" data-i="lead"></p>
    <form id="f" novalidate>
      <label data-i="name"></label>
      <input name="name" autocomplete="name" required>
      <label data-i="phone"></label>
      <div class="row">
        <select name="cc" id="cc"></select>
        <input name="num" inputmode="tel" autocomplete="tel-national" placeholder="917 555 0100" required>
      </div>
      <div class="hint" id="langhint"></div>
      <label data-i="email"></label>
      <input name="email" type="email" autocomplete="email" placeholder="you@example.com">
      <label data-i="ilang"></label>
      <select name="locale" id="locale"></select>
      <label data-i="matter"></label>
      <textarea name="matter" maxlength="500"></textarea>
      <label class="consent"><input type="checkbox" name="consent"><span data-i="consent"></span></label>
      <button class="go" type="submit" data-i="go"></button>
      <div class="msg" id="msg"></div>
    </form>
  </div>
  <footer data-i="foot"></footer>
</div>
<script>
const I18N = {
  en: {
    title: "Request a consultation", lead: "Leave your name and number. Our intake assistant will call you back within a minute and take down the details — in the language you choose.",
    name: "Your name", phone: "Phone number", email: "Email (optional — we'll confirm it on the call)", ilang: "Interview language", matter: "What is this about? (optional)",
    consent: "I agree to receive a call from Nota.Lawyer at this number. This call collects information only; it is not legal advice and does not create an attorney-client relationship.",
    go: "Call me now", calling: "Calling you now at {phone} — please pick up.", done: "Thank you — an attorney will review your information and follow up.",
    err: "We couldn't place the call: {m}", missing: "Please fill in your name, phone number and consent.",
    hint1: "Interview languages available for {country} numbers: {langs}.", hintES: "Spanish interviews are available for Mexico, Spain and Honduras numbers. For US numbers the call is in English; you may still describe your matter in Spanish below.",
    foot: "Available languages depend on the country of the phone number."
  },
  es: {
    title: "Solicite una consulta", lead: "Deje su nombre y número. Nuestra asistente de admisión le llamará en menos de un minuto para tomar los datos — en el idioma que elija.",
    name: "Su nombre", phone: "Número de teléfono", email: "Correo electrónico (opcional — lo confirmaremos en la llamada)", ilang: "Idioma de la entrevista", matter: "¿De qué se trata? (opcional)",
    consent: "Acepto recibir una llamada de Nota.Lawyer a este número. La llamada solo recopila información; no es asesoría legal ni crea una relación abogado-cliente.",
    go: "Llámenme ahora", calling: "Le estamos llamando al {phone} — por favor conteste.", done: "Gracias — un abogado revisará su información y se comunicará con usted.",
    err: "No pudimos realizar la llamada: {m}", missing: "Por favor complete su nombre, teléfono y consentimiento.",
    hint1: "Idiomas disponibles para números de {country}: {langs}.", hintES: "Las entrevistas en español están disponibles para números de México, España y Honduras. Para números de EE. UU. la llamada es en inglés; puede describir su asunto en español abajo.",
    foot: "Los idiomas disponibles dependen del país del número de teléfono."
  },
  id: {
    title: "Minta konsultasi", lead: "Tinggalkan nama dan nomor Anda. Asisten penerimaan kami akan menelepon Anda kembali dalam satu menit untuk mencatat detailnya — dalam bahasa yang Anda pilih.",
    name: "Nama Anda", phone: "Nomor telepon", email: "Email (opsional — akan kami pastikan saat panggilan)", ilang: "Bahasa wawancara", matter: "Tentang apa ini? (opsional)",
    consent: "Saya setuju menerima panggilan dari Nota.Lawyer di nomor ini. Panggilan ini hanya mengumpulkan informasi; bukan nasihat hukum dan tidak menciptakan hubungan pengacara-klien.",
    go: "Telepon saya sekarang", calling: "Kami sedang menelepon Anda di {phone} — mohon angkat.", done: "Terima kasih — seorang pengacara akan meninjau informasi Anda dan menghubungi kembali.",
    err: "Kami tidak dapat melakukan panggilan: {m}", missing: "Mohon isi nama, nomor telepon, dan persetujuan Anda.",
    hint1: "Bahasa wawancara yang tersedia untuk nomor {country}: {langs}.", hintES: "Wawancara dalam Bahasa Indonesia tersedia untuk nomor AS. Untuk nomor lain, pilih bahasa yang tersedia di atas.",
    foot: "Bahasa yang tersedia bergantung pada negara nomor telepon."
  }
};
// Country/language matrix comes from CALL-E's published table (public/regions.json, 42 countries).
let REGIONS = {"1":{"region":"US","country":"United States","line":"Local","locales":[["en-US","English"]]}};
let CC = [], LOCALES = {};
const flag = r => String.fromCodePoint(...[...r].map(c => 0x1F1E6 + c.charCodeAt(0) - 65));
function buildCountries() {
  CC = Object.entries(REGIONS).map(([v, r]) => [v, `${flag(r.region)} +${v} ${r.region}`, r.country, r.line])
    .sort((a, b) => (a[3] === b[3] ? a[2].localeCompare(b[2]) : a[3] === "Local" ? -1 : 1));
  LOCALES = Object.fromEntries(Object.entries(REGIONS).map(([v, r]) => [v, r.locales]));
}
buildCountries();
let lang = (["es","id"].find(l => (navigator.language||"en").toLowerCase().startsWith(l))) || "en";
const $ = s => document.querySelector(s);
const cc = $("#cc"), loc = $("#locale"), msg = $("#msg");
function fillCountries() { const cur = cc.value; cc.innerHTML = ""; CC.forEach(([v,label]) => cc.add(new Option(label, v))); cc.value = CC.some(c=>c[0]===cur) ? cur : "1"; }
fillCountries();
fetch("/regions.json").then(r => r.json()).then(j => { REGIONS = j; buildCountries(); fillCountries(); render(); }).catch(() => {});
function t(k, vars={}) { return (I18N[lang][k]||k).replace(/{(\w+)}/g, (_,x)=>vars[x]??""); }
function render() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(el => el.textContent = t(el.dataset.i));
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.l===lang));
  const opts = LOCALES[cc.value]||[]; const cur = loc.value; loc.innerHTML = "";
  opts.forEach(([v,l]) => loc.add(new Option(l, v)));
  const pref = opts.find(o=>o[0].startsWith(lang)) || opts.find(o=>o[0].startsWith("en"));
  loc.value = opts.some(o=>o[0]===cur) ? cur : (pref||opts[0])[0];
  const country = CC.find(c=>c[0]===cc.value) || CC[0]; const cname = country[2];
  let h = t("hint1", {country: cname, langs: opts.map(o=>o[1]).join(", ")});
  if (lang!=="en" && !opts.some(o=>o[0].startsWith(lang))) h += " " + t("hintES");
  $("#langhint").textContent = h;
}
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.l; render(); });
cc.onchange = render; render();
$("#f").onsubmit = async e => {
  e.preventDefault(); const f = e.target; msg.className = "msg";
  const phone = "+" + cc.value + f.num.value.replace(/\D/g,"");
  if (!f.name.value.trim() || f.num.value.replace(/\D/g,"").length < 6 || !f.consent.checked) { msg.className="msg err"; msg.textContent=t("missing"); return; }
  const btn = f.querySelector("button.go"); btn.disabled = true;
  try {
    const r = await fetch("/api/intake", {method:"POST", headers:{"content-type":"application/json"},
      body: JSON.stringify({name:f.name.value.trim(), phone, email:f.email.value.trim(), lang, locale:loc.value, matter:f.matter.value.trim(), consent:true})});
    const j = await r.json();
    if (!r.ok) throw new Error(j.message || j.error || r.status);
    msg.className = "msg ok"; msg.textContent = t("calling", {phone}) + " " + t("done");
    f.reset(); render();
  } catch (err) { msg.className = "msg err"; msg.textContent = t("err", {m: err.message}); }
  btn.disabled = false;
};
</script>
</body>
</html>
